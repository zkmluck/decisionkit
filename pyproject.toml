[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionkit"
version = "0.1.0"
description = "Typed decisions without a GPU: state in, calibrated distributions out, zero decoded tokens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
decisionkit = "decisionkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
